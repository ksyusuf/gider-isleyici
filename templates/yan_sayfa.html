<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Doküman Kontrol</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="/static/styles/css.css">
    <link rel="stylesheet" href="/static/styles/Buttons.css">
    <link rel="stylesheet" href="/static/styles/WorkingOnAnimation.css">
    <link rel="stylesheet" href="/static/styles/HarcamaTablosu.css">
    <link rel="icon" type="image/x-icon" href="../static/img/icons8-walter-white-beyaz.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
<div class="content" style="padding-top: 25px;">
    <div class="container">
        <div class="row">

            <div class="d-flex justify-content-center">
                <img src="https://img.icons8.com/ios-filled/100/000000/walter-white.png" class="">
            </div>
            <div class="sk-spinner sk-spinner-pulse"></div>

            <h1 class="d-flex justify-content-center align-items-center flex-column my-3 tracking-in-expand">YAN
                SAYFA</h1>

            <div class="d-flex flex-column align-items-center justify-content-center">
                <input class="bn5 m-2" type="submit" id="devamEt" value="DEVAM ET (BAŞLA)">
                <input class="bn5 m-2" type="submit" id="durdur" value="DURDUR">
                <a href="/devamEt"><input class="bn5 m-2" type="submit" value="devamEt (GET)"></a>
                <a href="/durdur"><input class="bn5 m-2" type="submit" value="durdur (GET)"></a>

                <br><br>
            </div>
            <div>
                <h1 class="kontrol" id="stil0"></h1><br><br>
            </div>

            <div class="d-flex flex-wrap justify-content-center mt-3 mb-3">
                <a href="/" id="yanSayfaButon">&larr; Ana sayfaya</a>
            </div>

            <div class="d-flex flex-wrap justify-content-center mt-3 mb-3">
                <a href="/gizlilik-politikasi">Gizlilik Politikası</a>
                <a href="/kullanim-kosullari">Kullanım Şartları</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
<script type=text/javascript>
    $(function() {
        $('#devamEt').bind('click', function() {
            $.ajax( {
                url: '/devamEt',
                type: 'POST',
                success: function ( donen_veri ) {
                    $('#stil0').html(donen_veri)
                },
                error: function( donen_veri )
                {
                    $("#stil0").html("!! ERROR BLOĞU !!");
                }
            });
        });
    });

</script>

<script type=text/javascript>
    $(function() {
        $('#durdur').bind('click', function() {
            $.ajax( {
                url: '/durdur',
                type: 'POST',
                success: function ( donen_veri ) {
                    $('#stil0').html(donen_veri)
                },
                error: function(request, ajaxOptions, thrownError)
                {
                    $("#stil0").html("!! ERROR BLOĞU !!");
                }
            });
        });
    });
</script>
